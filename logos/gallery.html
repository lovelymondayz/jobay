<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Logos — IP as Logo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; color: #fff; font-family: system-ui, -apple-system, sans-serif; padding: 40px 20px; }
h1 { text-align: center; margin-bottom: 8px; font-size: 2rem; }
.subtitle { text-align: center; color: #888; margin-bottom: 32px; font-size: 0.9rem; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; }
.project-card { background: #111; border-radius: 12px; padding: 16px; text-align: center; border: 1px solid #222; }
.project-card h3 { font-size: 0.9rem; margin-bottom: 8px; color: #e0e0e0; }
.project-card img { width: 100%; border-radius: 8px; }
.badge { display: inline-block; background: #22c55e; color: #000; font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: bold; margin-top: 8px; }
</style>
</head>
<body>

<h1>🎨 Project Logos</h1>
<p class="subtitle">A1 variants selected — deployed to each project's public folder</p>

<div class="gallery">

<div class="project-card"><h3>digital-yearbook</h3><img src="digital-yearbook/A1.png" alt="digital-yearbook"><div class="badge">A1 ✓</div></div>
<div class="project-card"><h3>idx-watcher</h3><img src="idx-watcher/A1.png" alt="idx-watcher"><div class="badge">A1 ✓</div></div>
<div class="project-card"><h3>internet-storage</h3><img src="internet-storage/A1.png" alt="internet-storage"><div class="badge">A1 ✓</div></div>
<div class="project-card"><h3>leadgen-localbiz</h3><img src="leadgen-localbiz/A1.png" alt="leadgen-localbiz"><div class="badge">A1 ✓</div></div>
<div class="project-card"><h3>members</h3><img src="members/A1.png" alt="members"><div class="badge">A1 ✓</div></div>
<div class="project-card"><h3>mentengdutch</h3><img src="mentengdutch/A1.png" alt="mentengdutch"><div class="badge">A1 ✓</div></div>
<div class="project-card"><h3>noidk</h3><img src="noidk/A1.png" alt="noidk"><div class="badge">A1 ✓</div></div>
<div class="project-card"><h3>pico</h3><img src="pico/A1.png" alt="pico"><div class="badge">A1 ✓</div></div>
<div class="project-card"><h3>qlio-platform</h3><img src="qlio-platform/A1.png" alt="qlio-platform"><div class="badge">A1 ✓</div></div>
<div class="project-card"><h3>say-less</h3><img src="say-less/A1.png" alt="say-less"><div class="badge">A1 ✓</div></div>
<div class="project-card"><h3>wedding-invitation</h3><img src="wedding-invitation/A1.png" alt="wedding-invitation"><div class="badge">A1 ✓</div></div>

</div>

</body>
</html>
