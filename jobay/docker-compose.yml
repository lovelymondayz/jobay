services:
  jobay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobay
    ports:
      - "3010:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/jobay.json
      - UPLOADS_DIR=/app/data/cvs
      - AI_BASE_URL=https://9router.nousresearch.com/v1
      - AI_MODEL=poolside/laguna-m.1:free
      - FIRECRAWL_API_KEY=fc-58316613a6a452575666905d76ed9ad0
      - WORKER_URL=http://jobay-worker:3011
    volumes:
      - jobay-data:/app/data
    restart: unless-stopped
    depends_on:
      - jobay-worker

  jobay-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: jobay-worker
    ports:
      - "3011:3011"
    environment:
      - WORKER_PORT=3011
      - SCREENSHOT_DIR=/app/data/screenshots
    volumes:
      - jobay-data:/app/data
    restart: unless-stopped

volumes:
  jobay-data:
